# Integración continua: en cada Pull Request hacia develop o main, GitHub
# compila la app y corre las pruebas unitarias en una máquina Linux.
# Si algo falla, el PR muestra una ❌ y no se debe fusionar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Si alguien sube otro commit al mismo PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      # El proyecto usa JDK 25 (ver gradle/gradle-daemon-jvm.properties).
      - name: Instalar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Correr pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      # Las pruebas de UI (androidTest) necesitan emulador; se corren en la
      # computadora de cada quien antes de abrir el PR. Aquí solo se
      # verifica que compilen.
      - name: Compilar pruebas de UI
        run: ./gradlew assembleDebugAndroidTest --stacktrace

      - name: Guardar reporte de pruebas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: app/build/reports/
